# Copy to 21-secret.yaml, fill in, and apply. Do not commit the filled version.
#
#   kubectl -n jido-swarm create secret generic jido-swarm \
#     --from-literal=SECRET_KEY_BASE="$(mix phx.gen.secret)" \
#     --from-literal=GITHUB_TOKEN=ghp_... \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# Only SECRET_KEY_BASE is required to boot. Without the others the swarm
# degrades rather than failing:
#
#   GITHUB_TOKEN missing       — implements and tests, but does not push or open PRs
#   ANTHROPIC_API_KEY missing  — stays on the local model
#   AWS_* missing              — the graph is per-pod, replicated only over :pg
apiVersion: v1
kind: Secret
metadata:
  name: jido-swarm
  namespace: jido-swarm
type: Opaque
stringData:
  SECRET_KEY_BASE: "replace-me-with-64-random-bytes"
  GITHUB_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
