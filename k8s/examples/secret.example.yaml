# Reference only — NOT applied by `kubectl apply -f k8s/`, which is exactly why
# it lives in this subdirectory (that command is not recursive). Applying this
# file would overwrite a working Secret with empty placeholders and take the
# swarm off its model and its GitHub access in one step.
#
# Create the real Secret with the command below instead.
#
#   kubectl -n jido-swarm create secret generic jido-swarm \
#     --from-literal=SECRET_KEY_BASE="$(mix phx.gen.secret)" \
#     --from-literal=RELEASE_COOKIE="$(mix phx.gen.secret 32)" \
#     --from-literal=GITHUB_TOKEN=ghp_... \
#     --from-literal=RAGENTIC_TOKEN=ragentic_... \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=ANTHROPIC_WORKSPACE_ID=wrkspc_... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# Only SECRET_KEY_BASE is required to boot. Without the others the swarm
# degrades rather than failing:
#
#   GITHUB_TOKEN missing       — implements and tests, but does not push or open PRs
#   RAGENTIC_TOKEN missing     — with LLM_PROVIDER=ragentic, no model at all; every job fails with a hint
#   ANTHROPIC_API_KEY missing  — with LLM_PROVIDER=anthropic, the same
#   ANTHROPIC_WORKSPACE_ID     — only needed for an ORGANIZATION-scoped key. A
#                                workspace-scoped key carries its workspace
#                                implicitly and needs no header.
#   AWS_* missing              — the graph is per-pod, replicated only over :pg
apiVersion: v1
kind: Secret
metadata:
  name: jido-swarm
  namespace: jido-swarm
type: Opaque
stringData:
  SECRET_KEY_BASE: "replace-me-with-64-random-bytes"
  # Shared by every pod so they can form a BEAM cluster. Must be identical
  # across replicas and stable across builds — see the note in the Deployment.
  RELEASE_COOKIE: "replace-me-with-a-random-string"
  GITHUB_TOKEN: ""
  # A ragentic API key with the api scope (LLM_PROVIDER=ragentic).
  RAGENTIC_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  # Only for an org-scoped key; leave empty for a workspace-scoped one.
  ANTHROPIC_WORKSPACE_ID: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
