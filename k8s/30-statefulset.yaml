# A StatefulSet rather than a Deployment, for two reasons that both come from
# the knowledge mesh.
#
# **Durable graphs.** Each replica gets its own PersistentVolumeClaim, so the
# graph file survives rescheduling rather than dying with an emptyDir. The mesh
# can rebuild a lost replica from its peers, but only while a peer is up — a
# simultaneous restart of every pod would otherwise lose everything learned.
#
# **Stable origins.** A pod's name is its identity in the mesh, and the mesh
# orders writes by `{seq, origin}`. Deployment pods get a fresh random name on
# every restart, so a replica's whole history becomes a stranger's each time it
# comes back. StatefulSet names (jido-swarm-0, -1) are stable for the life of
# the replica, which is what the ordering assumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jido-swarm
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
spec:
  serviceName: jido-swarm-headless
  replicas: 2
  # The replicas are peers, not a sequence — one does not need another to exist
  # before it can start, and waiting would double the rollout time for nothing.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: jido-swarm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jido-swarm
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: jido-swarm
          image: harbor.home/library/jido-swarm:latest
          # `:latest` is a moving tag, and IfNotPresent would keep whatever the
          # node already cached — a rollout would restart the pods and quietly
          # run the previous build.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: jido-swarm
            - secretRef:
                name: jido-swarm
          env:
            # Declared first: Kubernetes only substitutes $(VAR) from variables
            # defined *earlier* in this list.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The mesh origin. Stable across restarts now that it is a
            # StatefulSet ordinal rather than a Deployment's random suffix.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DNS_CLUSTER_QUERY
              value: jido-swarm-headless.jido-swarm.svc.cluster.local
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: jido_swarm@$(POD_IP)
            # `mix release` bakes a freshly generated cookie into every build,
            # so two pods running different image versions could never complete
            # the distribution handshake — exactly what happens mid-rollout.
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: jido-swarm
                  key: RELEASE_COOKIE
          volumeMounts:
            - name: data
              mountPath: /var/lib/jido_swarm
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Cloning three repositories and running their test suites is the
              # memory-hungry part, not the graph.
              memory: 3Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            # The graph is small; the repository clones and their build
            # artifacts are what need room.
            storage: 10Gi
