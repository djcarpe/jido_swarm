apiVersion: v1
kind: Service
metadata:
  name: jido-swarm
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
  annotations:
    # A browser session must keep talking to the same replica. A websocket
    # is one connection and does that by itself, but LiveView falls back to
    # long polling when the socket is slow to join, and every poll is a new
    # request — without a sticky cookie two replicas take turns and the
    # session is never found, which reads as a page that cannot stay up.
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: jido_swarm_replica
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jido-swarm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Headless, so DNSCluster can resolve every replica's address and the nodes can
# form a BEAM cluster. The `:pg` mesh transport rides on that.
apiVersion: v1
kind: Service
metadata:
  name: jido-swarm-headless
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: jido-swarm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jido-swarm
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
  annotations:
    # A real certificate from the cluster's own CA, the same way blog.home and
    # the other services get one. Not cosmetic: the app sends HSTS
    # (Phoenix force_ssl), and a browser that has seen HSTS for this host will
    # refuse a self-signed certificate outright — no click-through, no way in.
    # Traefik's default cert plus HSTS makes the site unreachable, not merely
    # untrusted.
    cert-manager.io/cluster-issuer: step-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swarm.home
      secretName: jido-swarm-home-tls
  rules:
    - host: swarm.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jido-swarm
                port:
                  name: http
