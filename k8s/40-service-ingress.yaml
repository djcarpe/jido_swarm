apiVersion: v1
kind: Service
metadata:
  name: jido-swarm
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jido-swarm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Headless, so DNSCluster can resolve every replica's address and the nodes can
# form a BEAM cluster. The `:pg` mesh transport rides on that.
apiVersion: v1
kind: Service
metadata:
  name: jido-swarm-headless
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: jido-swarm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jido-swarm
  namespace: jido-swarm
  labels:
    app.kubernetes.io/name: jido-swarm
spec:
  ingressClassName: traefik
  rules:
    - host: swarm.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jido-swarm
                port:
                  name: http
